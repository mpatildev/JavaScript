<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="JS6.css">
</head>
<body>

    <div class="container">
        <h1>My Shopping List</h1>
        <p id="today-date" class="date"></p>

        <div class="shopping-section">
            <h3>🛒 Purchased Items</h3>
            <div id="shop-list"></div>
            <div id="purchased-total" class="total purchased-total"></div>
        </div>

        <div class="shopping-section">
            <h3>📝 Unpurchased Items</h3>
            <div id="pending-list"></div>
            <div id="unpurchased-total" class="total pending-total"></div>
        </div>
    </div>

    <script src="JS6.js"></script>
</body>
</html>
